<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steven Widinata | Curious Mind, Endless Possibilities</title>
  <meta name="description" content="Steven Widinata, an Information Technology student at BINUS University. My journey, projects, achievements and what comes next.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply saved/system theme before first paint to avoid a flash
    (function () {
      var t = localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="backdrop" aria-hidden="true">
    <span class="aurora aurora--1"></span>
    <span class="aurora aurora--2"></span>
  </div>

  <header class="header">
    <div class="container header__inner">
      <a class="brand" href="#top" aria-label="Steven Widinata, back to top">
        <img src="assets/favicon.svg" alt="" width="32" height="32">
        <span>steven<span class="grad-text">.w</span></span>
      </a>

      <nav class="nav" id="nav" aria-label="Main">
        <ul class="nav__list">
          <li><a class="nav__link" href="#about">About</a></li>
          <li><a class="nav__link" href="#journey">Journey</a></li>
          <li><a class="nav__link" href="#projects">Projects</a></li>
          <li><a class="nav__link" href="#achievements">Achievements</a></li>
          <li><a class="nav__link" href="#possibilities">Next</a></li>
          <li><a class="nav__link" href="#contact">Contact</a></li>
        </ul>
      </nav>

      <div class="header__actions">
        <button class="icon-btn theme-toggle" type="button" aria-label="Toggle dark and light mode">
          <svg class="icon icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav">
          <span class="menu-toggle__bars" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
  </main>

  <script src="js/main.js" defer></script>
</body>
</html>
